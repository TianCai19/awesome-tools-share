<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>精选工具分享</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen">
    <div id="app" class="max-w-5xl mx-auto px-4 py-12">
        <header class="text-center mb-10">
            <h1 class="text-4xl font-extrabold text-gray-900 tracking-tight mb-4">✨ 精选好用工具分享</h1>
            <p class="text-lg text-gray-600">发现、收集并分享那些解决实际痛点的高效工具。</p>
        </header>

        <!-- 筛选区 -->
        <section class="mb-10 bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-bold text-gray-800 flex items-center">
                    <svg class="w-5 h-5 mr-2 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path></svg>
                    层级分类筛选
                </h3>
                <button v-if="selectedL1" @click="clearFilters" class="text-sm text-gray-500 hover:text-blue-600 transition-colors">清除筛选</button>
            </div>

            <!-- 一级分类 -->
            <div class="flex flex-wrap items-center gap-2 mb-3">
                <span class="text-sm font-medium text-gray-400 w-12">一级:</span>
                <button v-for="cat in availableL1" :key="cat"
                        @click="selectL1(cat)"
                        :class="['px-3 py-1.5 rounded-lg text-sm font-medium transition-colors', selectedL1 === cat ? 'bg-blue-600 text-white shadow-sm' : 'bg-gray-100 text-gray-600 hover:bg-gray-200']">
                    {{ cat }}
                </button>
            </div>

            <!-- 二级分类 -->
            <div class="flex flex-wrap items-center gap-2 mb-3" v-if="selectedL1 && availableL2.length > 0">
                <span class="text-sm font-medium text-gray-400 w-12">二级:</span>
                <button v-for="cat in availableL2" :key="cat"
                        @click="selectL2(cat)"
                        :class="['px-3 py-1.5 rounded-lg text-sm font-medium transition-colors', selectedL2 === cat ? 'bg-indigo-500 text-white shadow-sm' : 'bg-gray-100 text-gray-600 hover:bg-gray-200']">
                    {{ cat }}
                </button>
            </div>

            <!-- 三级分类 -->
            <div class="flex flex-wrap items-center gap-2" v-if="selectedL2 && availableL3.length > 0">
                <span class="text-sm font-medium text-gray-400 w-12">三级:</span>
                <button v-for="cat in availableL3" :key="cat"
                        @click="selectL3(cat)"
                        :class="['px-3 py-1.5 rounded-lg text-sm font-medium transition-colors', selectedL3 === cat ? 'bg-emerald-500 text-white shadow-sm' : 'bg-gray-100 text-gray-600 hover:bg-gray-200']">
                    {{ cat }}
                </button>
            </div>
        </section>

        <!-- 工具列表 -->
        <main class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div v-if="filteredTools.length === 0" class="col-span-full text-center py-12 text-gray-500">
                没有找到符合该分类的工具 📭
            </div>
            
            <article v-for="tool in filteredTools" :key="tool.name" class="bg-white rounded-2xl shadow-sm hover:shadow-md transition-shadow duration-300 border border-gray-200 overflow-hidden flex flex-col">
                <div class="p-6 flex-grow">
                    <div class="flex justify-between items-start mb-3">
                        <h2 class="text-2xl font-bold text-gray-900">{{ tool.name }}</h2>
                    </div>
                    
                    <!-- 层级面包屑展示 -->
                    <div class="flex flex-wrap items-center text-xs font-semibold text-gray-500 mb-6 bg-gray-50 p-2.5 rounded-lg border border-gray-100">
                        <span class="text-blue-600">{{ tool.categories[0] }}</span>
                        <svg class="w-3.5 h-3.5 mx-1.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                        <span class="text-indigo-500">{{ tool.categories[1] }}</span>
                        <svg class="w-3.5 h-3.5 mx-1.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                        <span class="text-emerald-600">{{ tool.categories[2] }}</span>
                    </div>

                    <div class="mb-5">
                        <h3 class="text-sm font-bold text-red-500 uppercase tracking-wider mb-2 flex items-center">
                            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                            痛点
                        </h3>
                        <p class="text-gray-600 text-sm leading-relaxed">{{ tool.painPoint }}</p>
                    </div>
                    <div>
                        <h3 class="text-sm font-bold text-blue-500 uppercase tracking-wider mb-2 flex items-center">
                            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                            解决与介绍
                        </h3>
                        <p class="text-gray-600 text-sm leading-relaxed">{{ tool.description }}</p>
                    </div>
                </div>
                <div class="bg-gray-50 px-6 py-4 border-t border-gray-100 mt-auto">
                    <a :href="tool.link" target="_blank" rel="noopener noreferrer" class="inline-flex items-center justify-center w-full bg-black text-white px-4 py-2 rounded-lg font-medium hover:bg-gray-800 transition-colors duration-200">
                        访问工具
                        <svg class="w-4 h-4 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                    </a>
                </div>
            </article>
        </main>
    </div>

    <script>
        const { createApp } = Vue

        createApp({
            data() {
                return {
                    selectedL1: '',
                    selectedL2: '',
                    selectedL3: '',
                    tools: [
                        {
                            name: 'NoDup',
                            // 层次分类：一级 -> 二级 -> 三级
                            categories: ['效率工具', '浏览器扩展', '标签页管理'],
                            painPoint: '每次在对话或文档里点开链接都会新开一个标签，而不是去原来Chrome的位置找，导致Tab越来越多堆积如山，无法管理并陷入恶性循环。',
                            description: '直接跳转到已经打开的同名标签页而不是新开一个，有效防止标签页重复堆积，也方便快速回到Tab所在的项目上下文。',
                            link: 'https://chromewebstore.google.com/detail/nodup/jakomjnpemmaphhfialgbehagbcmaagh?'
                        },
                        {
                            name: 'Homebrew',
                            categories: ['开发工具', '包管理器', '系统环境'],
                            painPoint: 'macOS 原生缺少统一的软件和依赖包管理工具，开发环境中手动下载、解压、配置环境变量非常繁琐且难以更新维护。',
                            description: 'macOS（或 Linux）缺失的包管理器。通过简单的命令行即可安装、更新和管理各种常用软件包，让环境配置变得无比轻松。',
                            link: 'https://brew.sh/'
                        }
                    ]
                }
            },
            computed: {
                availableL1() {
                    return [...new Set(this.tools.map(t => t.categories[0]))];
                },
                availableL2() {
                    if (!this.selectedL1) return [];
                    return [...new Set(this.tools.filter(t => t.categories[0] === this.selectedL1).map(t => t.categories[1]))];
                },
                availableL3() {
                    if (!this.selectedL2) return [];
                    return [...new Set(this.tools.filter(t => t.categories[0] === this.selectedL1 && t.categories[1] === this.selectedL2).map(t => t.categories[2]))];
                },
                filteredTools() {
                    return this.tools.filter(t => {
                        if (this.selectedL1 && t.categories[0] !== this.selectedL1) return false;
                        if (this.selectedL2 && t.categories[1] !== this.selectedL2) return false;
                        if (this.selectedL3 && t.categories[2] !== this.selectedL3) return false;
                        return true;
                    });
                }
            },
            methods: {
                selectL1(cat) {
                    if (this.selectedL1 === cat) {
                        this.clearFilters();
                    } else {
                        this.selectedL1 = cat;
                        this.selectedL2 = '';
                        this.selectedL3 = '';
                    }
                },
                selectL2(cat) {
                    if (this.selectedL2 === cat) {
                        this.selectedL2 = '';
                        this.selectedL3 = '';
                    } else {
                        this.selectedL2 = cat;
                        this.selectedL3 = '';
                    }
                },
                selectL3(cat) {
                    if (this.selectedL3 === cat) {
                        this.selectedL3 = '';
                    } else {
                        this.selectedL3 = cat;
                    }
                },
                clearFilters() {
                    this.selectedL1 = '';
                    this.selectedL2 = '';
                    this.selectedL3 = '';
                }
            }
        }).mount('#app')
    </script>
</body>
</html>
